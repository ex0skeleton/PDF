<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Wiz — Image to PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
    --orange:#ff7900;
    --orange-hover:#e96f00;
    --orange-soft:#fff1e4;
    --bg:#f3f4f6;
    --panel:#ffffff;
    --text:#181a1f;
    --muted:#767d87;
    --border:#e2e5e9;
    --shadow:0 8px 28px rgba(15,23,42,.07);
    --settings-width:340px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);overflow-x:hidden
}
button,select{font:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
    height:66px;background:#fff;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;position:sticky;top:0;z-index:40
}
.brand{display:flex;align-items:center;gap:11px}
.brand-logo{
    width:40px;height:40px;border-radius:12px;background:var(--orange);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:900
}
.brand-copy h1{margin:0;font-size:18px;line-height:1.1}
.brand-copy p{margin:4px 0 0;color:var(--muted);font-size:11px}
.top-stat{
    padding:8px 12px;border-radius:9px;border:1px solid var(--border);
    background:#f8f9fa;color:var(--muted);font-size:11px
}
.workspace-shell{
    width:100%;flex:1;display:grid;grid-template-columns:minmax(0,1fr) var(--settings-width);
    min-height:calc(100vh - 66px)
}
.workspace{min-width:0;padding:20px 22px 42px}
.workspace-heading{
    display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px
}
.workspace-heading h2{margin:0;font-size:17px}
.workspace-subtitle{margin-top:5px;color:var(--muted);font-size:11px}
.workspace-actions{display:flex;gap:7px;align-items:center}
.utility-btn{
    min-height:34px;padding:7px 11px;border:1px solid var(--border);border-radius:9px;
    background:#fff;cursor:pointer;font-size:11px
}
.utility-btn:hover{background:#f9fafb}
.utility-btn.danger{color:#d92d20}
.initial-upload{
    width:100%;min-height:calc(100vh - 145px);border:2px dashed #cdd2d9;border-radius:20px;
    background:#fff;display:flex;align-items:center;justify-content:center;padding:40px;cursor:pointer;
    transition:border-color .2s,background .2s
}
.initial-upload:hover,.initial-upload.dragging{border-color:var(--orange);background:#fffaf6}
.initial-upload-content{text-align:center}
.upload-icon{
    width:70px;height:70px;margin:0 auto 16px;border-radius:18px;background:var(--orange-soft);
    color:var(--orange);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:500
}
.initial-upload h3{margin:0 0 8px;font-size:19px}
.initial-upload p{margin:0;color:var(--muted);line-height:1.6;font-size:12px}
.primary-select-btn{
    margin-top:18px;padding:11px 17px;border:0;border-radius:10px;background:var(--orange);
    color:#fff;cursor:pointer;font-size:12px;font-weight:800
}
.preview-grid{
    display:none;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:17px;align-items:start
}
.preview-card{
    min-width:0;background:#fff;border:1px solid var(--border);border-radius:15px;overflow:hidden;
    box-shadow:var(--shadow);position:relative;transition:transform .15s,border-color .15s,box-shadow .15s
}
.preview-card:hover{transform:translateY(-2px);border-color:#ffbc80}
.preview-card.drag-over{border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,121,0,.12),var(--shadow)}
.page-preview-stage{
    width:100%;height:320px;padding:18px;background:#e8eaed;display:flex;
    justify-content:center;align-items:center;overflow:hidden
}
.pdf-page-preview{
    position:relative;flex:none;overflow:hidden;background:#fff;
    box-shadow:0 5px 18px rgba(0,0,0,.18)
}
.pdf-page-preview.portrait[data-page="a4"]{height:276px;aspect-ratio:210/297}
.pdf-page-preview.portrait[data-page="letter"]{height:276px;aspect-ratio:216/279}
.pdf-page-preview.portrait[data-page="legal"]{height:276px;aspect-ratio:216/356}
.pdf-page-preview.landscape[data-page="a4"]{width:min(100%,285px);aspect-ratio:297/210}
.pdf-page-preview.landscape[data-page="letter"]{width:min(100%,285px);aspect-ratio:279/216}
.pdf-page-preview.landscape[data-page="legal"]{width:min(100%,285px);aspect-ratio:356/216}
.preview-margin-box{
    position:absolute;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff
}
.preview-image{display:block;width:100%;height:100%;max-width:none;max-height:none}
.preview-image.contain{object-fit:contain}
.preview-image.cover{object-fit:cover}
.preview-image.original{object-fit:contain}
.preview-card-footer{border-top:1px solid #eceef1;padding:11px 12px 12px}
.preview-file-name{
    font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.preview-file-meta{
    margin-top:5px;display:flex;align-items:center;justify-content:space-between;
    gap:8px;color:#969ca5;font-size:10px
}
.card-number{color:var(--orange);font-weight:800}
.card-actions{
    position:absolute;top:8px;right:8px;z-index:10;display:flex;gap:5px;opacity:0;transition:opacity .15s
}
.preview-card:hover .card-actions{opacity:1}
.card-btn{
    width:29px;height:29px;padding:0;border:0;border-radius:8px;background:rgba(25,25,25,.77);
    color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)
}
.card-btn:hover{background:#111}
.card-btn.delete:hover{background:#c62828}
.add-card{
    min-height:383px;border:2px dashed #cbd1d8;border-radius:15px;background:#fafbfc;
    display:flex;align-items:center;justify-content:center;padding:20px;cursor:pointer;
    transition:border-color .2s,background .2s
}
.add-card:hover,.add-card.dragging{border-color:var(--orange);background:#fffaf6}
.add-card-inner{text-align:center}
.add-card-icon{
    width:52px;height:52px;margin:0 auto 12px;border-radius:14px;background:var(--orange-soft);
    color:var(--orange);display:flex;align-items:center;justify-content:center;font-size:25px
}
.add-card-title{font-size:13px;font-weight:800}
.add-card-subtitle{margin-top:5px;color:var(--muted);font-size:10px}
.settings-panel{
    position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto;padding:21px;background:#fff;
    border-left:1px solid var(--border);z-index:30
}
.settings-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:21px}
.settings-header h2{margin:0;font-size:16px}
.close-settings{
    display:none;width:33px;height:33px;border:1px solid var(--border);border-radius:9px;background:#fff;cursor:pointer
}
.setting-section{margin-bottom:20px}
.setting-title{
    display:block;margin-bottom:9px;color:#4b525c;font-size:10px;font-weight:800;letter-spacing:.04em
}
select{
    width:100%;height:40px;padding:0 10px;border:1px solid #d9dde3;border-radius:9px;
    background:#fff;outline:0;color:#23262c
}
select:focus{border-color:var(--orange)}
.orientation-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.orientation-option{
    padding:11px 7px 10px;border:1px solid var(--border);border-radius:11px;background:#fff;cursor:pointer
}
.orientation-option.active{
    background:#fff8f1;border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)
}
.orientation-visual-wrap{height:47px;display:flex;align-items:center;justify-content:center}
.orientation-paper{
    background:#fff;border:2px solid #777e87;border-radius:2px;box-shadow:2px 3px 0 #e4e7eb
}
.orientation-option.active .orientation-paper{border-color:var(--orange)}
.portrait-icon{width:28px;height:40px}
.landscape-icon{width:43px;height:29px}
.orientation-label{margin-top:7px;text-align:center;font-size:10px;font-weight:800}
.check-row{
    display:flex;align-items:flex-start;gap:8px;color:#515863;font-size:10px;line-height:1.45
}
.check-row input{margin-top:2px;accent-color:var(--orange)}
.settings-divider{height:1px;margin:20px 0;background:#eceef1}
.summary{padding:12px;border-radius:11px;background:#f7f8fa}
.summary-line{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:10px}
.summary-label{color:var(--muted)}
.summary-value{font-weight:800}
.download-btn{
    width:100%;min-height:46px;margin-top:14px;border:0;border-radius:11px;background:var(--orange);
    color:#fff;cursor:pointer;font-size:12px;font-weight:900
}
.download-btn:hover{background:var(--orange-hover)}
.download-btn:disabled{cursor:not-allowed;opacity:.4}
.processing{display:none;margin-top:9px;text-align:center;color:var(--muted);font-size:10px}
.mobile-gear{display:none}
.settings-overlay{
    position:fixed;inset:66px 0 0;z-index:69;pointer-events:none;opacity:0;
    background:rgba(25,30,38,.17);backdrop-filter:blur(3px);transition:opacity .25s
}
.settings-overlay.open{opacity:1;pointer-events:auto}
.mobile-download-bar{display:none}

/* Orange slowly spinning gear */
.gear-svg{
    width:31px;
    height:31px;
    display:block;
    fill:var(--orange);
    animation:extremelySlowSpin 32s linear infinite;
}
@keyframes extremelySlowSpin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@media(max-width:920px){
    .workspace-shell{display:block}
    .workspace{padding:17px 15px 110px}
    .top-stat{display:none}
    .settings-panel{
        position:fixed;top:66px;right:0;bottom:0;z-index:80;width:min(76vw,390px);height:auto;
        transform:translateX(100%);transition:transform .28s ease;box-shadow:-15px 0 45px rgba(0,0,0,.17)
    }
    .settings-panel.open{transform:translateX(0)}
    .close-settings{display:flex;align-items:center;justify-content:center}
    .mobile-gear{
        position:fixed;right:0;top:43%;transform:translateY(-50%);z-index:60;width:50px;height:58px;
        border:1px solid #d7dbe0;border-right:0;border-radius:16px 0 0 16px;
        background:rgba(255,255,255,.95);box-shadow:-5px 5px 18px rgba(0,0,0,.10);
        cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)
    }
    .mobile-gear:hover{background:#fff}
    .mobile-download-bar{
        position:fixed;left:0;right:0;bottom:0;z-index:55;display:block;
        padding:10px 13px calc(10px + env(safe-area-inset-bottom));
        background:rgba(255,255,255,.94);border-top:1px solid var(--border);
        backdrop-filter:blur(14px);box-shadow:0 -8px 30px rgba(0,0,0,.06)
    }
    .mobile-download-btn{
        width:100%;min-height:48px;border:0;border-radius:12px;background:var(--orange);
        color:#fff;font-weight:900;cursor:pointer
    }
    .mobile-download-btn:disabled{opacity:.4;cursor:not-allowed}
    .settings-panel #downloadBtn{display:none}
    .settings-panel #processing{display:none !important}
}
@media(max-width:620px){
    .topbar{height:60px;padding:0 13px}
    .brand-logo{width:36px;height:36px;border-radius:10px;font-size:17px}
    .brand-copy h1{font-size:16px}
    .brand-copy p{display:none}
    .workspace{padding:14px 12px 105px}
    .workspace-heading{margin-bottom:12px}
    .workspace-heading h2{font-size:15px}
    .workspace-subtitle{font-size:9px}
    .utility-btn{min-height:31px;padding:6px 8px;font-size:10px}
    .initial-upload{min-height:calc(100vh - 125px);padding:25px}
    .preview-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .page-preview-stage{height:238px;padding:10px}
    .pdf-page-preview.portrait[data-page="a4"],
    .pdf-page-preview.portrait[data-page="letter"],
    .pdf-page-preview.portrait[data-page="legal"]{height:210px}
    .preview-card-footer{padding:9px 9px 10px}
    .preview-file-name{font-size:10px}
    .preview-file-meta{font-size:8px}
    .card-actions{opacity:1;top:5px;right:5px}
    .card-btn{width:25px;height:25px;border-radius:7px;font-size:10px}
    .add-card{min-height:294px}
    .settings-panel{top:60px;width:min(78vw,350px)}
    .settings-overlay{inset:60px 0 0}
    .mobile-gear{top:42%;width:48px;height:56px}
    .gear-svg{width:29px;height:29px}
}
@media(max-width:430px){
    .preview-grid{grid-template-columns:1fr}
    .page-preview-stage{height:330px}
    .pdf-page-preview.portrait[data-page="a4"],
    .pdf-page-preview.portrait[data-page="letter"],
    .pdf-page-preview.portrait[data-page="legal"]{height:295px}
    .add-card{min-height:155px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
    <div class="brand">
        <div class="brand-logo">P</div>
        <div class="brand-copy">
            <h1>PDF Wiz</h1>
            <p>Image to PDF Converter</p>
        </div>
    </div>
    <div class="top-stat" id="topStat">0 images</div>
</header>

<div class="workspace-shell">
<main class="workspace">
    <div class="workspace-heading">
        <div>
            <h2>PDF Preview</h2>
            <div class="workspace-subtitle" id="workspaceSubtitle">Add images to begin creating your PDF.</div>
        </div>
        <div class="workspace-actions" id="workspaceActions" style="display:none;">
            <button class="utility-btn" id="addImagesTop">+ Add</button>
            <button class="utility-btn danger" id="clearImages">Clear</button>
        </div>
    </div>

    <div class="initial-upload" id="initialUpload">
        <div class="initial-upload-content">
            <div class="upload-icon">⇧</div>
            <h3>Drop your images here</h3>
            <p>JPG, JPEG, PNG and WebP supported.<br>Add multiple images at once.</p>
            <button class="primary-select-btn" id="selectImagesBtn">Choose Images</button>
        </div>
    </div>

    <div class="preview-grid" id="previewGrid"></div>
    <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" multiple hidden>
</main>

<aside class="settings-panel" id="settingsPanel">
    <div class="settings-header">
        <h2>PDF Settings</h2>
        <button class="close-settings" id="closeSettings" aria-label="Close settings">✕</button>
    </div>

    <div class="setting-section">
        <label class="setting-title">PAGE SIZE</label>
        <select id="pageSize">
            <option value="a4">A4</option>
            <option value="letter">Letter</option>
            <option value="legal">Legal</option>
        </select>
    </div>

    <div class="setting-section">
        <label class="setting-title">ORIENTATION</label>
        <div class="orientation-options">
            <button class="orientation-option active" id="portraitOption" type="button">
                <div class="orientation-visual-wrap"><div class="orientation-paper portrait-icon"></div></div>
                <div class="orientation-label">Portrait</div>
            </button>
            <button class="orientation-option" id="landscapeOption" type="button">
                <div class="orientation-visual-wrap"><div class="orientation-paper landscape-icon"></div></div>
                <div class="orientation-label">Landscape</div>
            </button>
        </div>
    </div>

    <div class="setting-section">
        <label class="check-row">
            <input type="checkbox" id="autoOrientation">
            <span>Automatically use portrait or landscape depending on each image.</span>
        </label>
    </div>

    <div class="setting-section">
        <label class="setting-title">IMAGE FIT</label>
        <select id="imageFit">
            <option value="contain">Fit Entire Image</option>
            <option value="cover">Fill Page</option>
            <option value="original">Original Size</option>
        </select>
    </div>

    <div class="setting-section">
        <label class="setting-title">PAGE MARGIN</label>
        <select id="margin">
            <option value="0">No Margin</option>
            <option value="5">5 mm</option>
            <option value="10" selected>10 mm</option>
            <option value="15">15 mm</option>
            <option value="20">20 mm</option>
        </select>
    </div>

    <div class="setting-section">
        <label class="setting-title">IMAGE QUALITY</label>
        <select id="quality">
            <option value="1">Maximum Quality</option>
            <option value="0.92" selected>High Quality</option>
            <option value="0.8">Medium Quality</option>
            <option value="0.65">Smaller File</option>
        </select>
    </div>

    <div class="settings-divider"></div>

    <div class="summary">
        <div class="summary-line"><span class="summary-label">Images</span><span class="summary-value" id="summaryImages">0</span></div>
        <div class="summary-line"><span class="summary-label">PDF Pages</span><span class="summary-value" id="summaryPages">0</span></div>
        <div class="summary-line"><span class="summary-label">Format</span><span class="summary-value" id="summaryFormat">A4</span></div>
        <div class="summary-line"><span class="summary-label">Orientation</span><span class="summary-value" id="summaryOrientation">Portrait</span></div>
    </div>

    <button class="download-btn" id="downloadBtn" disabled>Download PDF</button>
    <div class="processing" id="processing">Creating your PDF...</div>
</aside>
</div>
</div>

<button class="mobile-gear" id="mobileGear" aria-label="Open PDF settings" title="PDF Settings">
    <svg class="gear-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.31-.6-.22l-2.39.96c-.5-.38-1.05-.7-1.66-.94L14.35 2.8c-.02-.24-.22-.43-.47-.43h-3.84c-.24 0-.44.18-.47.43L9.2 5.35c-.6.25-1.15.56-1.66.94l-2.39-.96c-.22-.08-.48 0-.6.22L2.64 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.31-.09.65-.09.94 0 .31.03.64.08.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.31.6.22l2.39-.96c.5.38 1.05.7 1.66.94l.36 2.55c.03.24.23.43.47.43h3.84c.24 0 .44-.18.47-.43l.37-2.55c.6-.25 1.15-.56 1.66-.94l2.39.96c.22.08.48 0 .6-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.02-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5A3.5 3.5 0 0 1 12 15.5Z"/>
    </svg>
</button>

<div class="settings-overlay" id="settingsOverlay"></div>

<div class="mobile-download-bar" id="mobileDownloadBar">
    <button class="mobile-download-btn" id="mobileDownloadBtn" disabled>Download PDF</button>
</div>

<script>
const { jsPDF } = window.jspdf;
let files = [];
let orientation = "portrait";
let draggedIndex = null;

const imageInput = document.getElementById("imageInput");
const initialUpload = document.getElementById("initialUpload");
const selectImagesBtn = document.getElementById("selectImagesBtn");
const previewGrid = document.getElementById("previewGrid");
const addImagesTop = document.getElementById("addImagesTop");
const clearImages = document.getElementById("clearImages");
const workspaceActions = document.getElementById("workspaceActions");
const workspaceSubtitle = document.getElementById("workspaceSubtitle");
const topStat = document.getElementById("topStat");
const pageSize = document.getElementById("pageSize");
const portraitOption = document.getElementById("portraitOption");
const landscapeOption = document.getElementById("landscapeOption");
const autoOrientation = document.getElementById("autoOrientation");
const imageFit = document.getElementById("imageFit");
const marginInput = document.getElementById("margin");
const qualityInput = document.getElementById("quality");
const summaryImages = document.getElementById("summaryImages");
const summaryPages = document.getElementById("summaryPages");
const summaryFormat = document.getElementById("summaryFormat");
const summaryOrientation = document.getElementById("summaryOrientation");
const downloadBtn = document.getElementById("downloadBtn");
const mobileDownloadBtn = document.getElementById("mobileDownloadBtn");
const processing = document.getElementById("processing");
const mobileGear = document.getElementById("mobileGear");
const settingsPanel = document.getElementById("settingsPanel");
const settingsOverlay = document.getElementById("settingsOverlay");
const closeSettings = document.getElementById("closeSettings");

function openSettings(){
    settingsPanel.classList.add("open");
    settingsOverlay.classList.add("open");
    document.body.style.overflow = "hidden";
}
function hideSettings(){
    settingsPanel.classList.remove("open");
    settingsOverlay.classList.remove("open");
    document.body.style.overflow = "";
}
mobileGear.addEventListener("click", openSettings);
closeSettings.addEventListener("click", hideSettings);
settingsOverlay.addEventListener("click", hideSettings);

selectImagesBtn.addEventListener("click", e => { e.stopPropagation(); imageInput.click(); });
initialUpload.addEventListener("click", () => imageInput.click());
addImagesTop.addEventListener("click", () => imageInput.click());

imageInput.addEventListener("change", e => {
    addFiles(e.target.files);
    imageInput.value = "";
});

initialUpload.addEventListener("dragover", e => {
    e.preventDefault();
    initialUpload.classList.add("dragging");
});
initialUpload.addEventListener("dragleave", () => initialUpload.classList.remove("dragging"));
initialUpload.addEventListener("drop", e => {
    e.preventDefault();
    initialUpload.classList.remove("dragging");
    addFiles(e.dataTransfer.files);
});

async function addFiles(fileList){
    const selectedFiles = Array.from(fileList).filter(file =>
        ["image/jpeg","image/png","image/webp"].includes(file.type)
    );

    for(const file of selectedFiles){
        const url = URL.createObjectURL(file);
        try{
            const image = await loadImage(url);
            files.push({
                id: Date.now()+"-"+Math.random(),
                file,
                url,
                width:image.naturalWidth,
                height:image.naturalHeight
            });
        }catch(error){
            URL.revokeObjectURL(url);
            console.error("Could not load image:", file.name);
        }
    }
    renderInterface();
}

function renderInterface(){
    const hasFiles = files.length > 0;
    initialUpload.style.display = hasFiles ? "none" : "flex";
    previewGrid.style.display = hasFiles ? "grid" : "none";
    workspaceActions.style.display = hasFiles ? "flex" : "none";
    downloadBtn.disabled = !hasFiles;
    mobileDownloadBtn.disabled = !hasFiles;
    workspaceSubtitle.textContent = hasFiles
        ? "Drag image cards to change PDF page order."
        : "Add images to begin creating your PDF.";
    renderPreviewCards();
    updateSummary();
}

function renderPreviewCards(){
    previewGrid.innerHTML = "";

    files.forEach((item,index) => {
        const card = document.createElement("div");
        card.className = "preview-card";
        card.draggable = true;

        const pageOrientation = getPageOrientation(item);
        const marginPercent = getPreviewMargin(Number(marginInput.value));

        card.innerHTML = `
            <div class="card-actions">
                <button class="card-btn move-left" type="button" title="Move backward">←</button>
                <button class="card-btn move-right" type="button" title="Move forward">→</button>
                <button class="card-btn delete" type="button" title="Remove image">×</button>
            </div>

            <div class="page-preview-stage">
                <div class="pdf-page-preview ${pageOrientation}" data-page="${pageSize.value}">
                    <div class="preview-margin-box"
                        style="top:${marginPercent}%;right:${marginPercent}%;bottom:${marginPercent}%;left:${marginPercent}%;">
                        <img src="${item.url}" class="preview-image ${imageFit.value}"
                            alt="${escapeHTML(item.file.name)}" draggable="false">
                    </div>
                </div>
            </div>

            <div class="preview-card-footer">
                <div class="preview-file-name" title="${escapeHTML(item.file.name)}">
                    ${escapeHTML(item.file.name)}
                </div>
                <div class="preview-file-meta">
                    <span>${formatFileSize(item.file.size)}</span>
                    <span class="card-number">Page ${index+1}</span>
                </div>
            </div>
        `;

        card.querySelector(".delete").addEventListener("click", e => {
            e.stopPropagation(); removeImage(index);
        });
        card.querySelector(".move-left").addEventListener("click", e => {
            e.stopPropagation(); moveImage(index,-1);
        });
        card.querySelector(".move-right").addEventListener("click", e => {
            e.stopPropagation(); moveImage(index,1);
        });

        card.addEventListener("dragstart", () => draggedIndex = index);
        card.addEventListener("dragover", e => {
            e.preventDefault(); card.classList.add("drag-over");
        });
        card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
        card.addEventListener("drop", e => {
            e.preventDefault();
            card.classList.remove("drag-over");
            if(draggedIndex === null || draggedIndex === index) return;
            const moved = files.splice(draggedIndex,1)[0];
            files.splice(index,0,moved);
            draggedIndex = null;
            renderInterface();
        });

        previewGrid.appendChild(card);
    });

    if(files.length > 0){
        const addCard = document.createElement("div");
        addCard.className = "add-card";
        addCard.innerHTML = `
            <div class="add-card-inner">
                <div class="add-card-icon">+</div>
                <div class="add-card-title">Add More Images</div>
                <div class="add-card-subtitle">Click or drop files here</div>
            </div>
        `;
        addCard.addEventListener("click", () => imageInput.click());
        addCard.addEventListener("dragover", e => {
            e.preventDefault(); addCard.classList.add("dragging");
        });
        addCard.addEventListener("dragleave", () => addCard.classList.remove("dragging"));
        addCard.addEventListener("drop", e => {
            e.preventDefault(); e.stopPropagation();
            addCard.classList.remove("dragging");
            addFiles(e.dataTransfer.files);
        });
        previewGrid.appendChild(addCard);
    }
}

function getPageOrientation(item){
    if(autoOrientation.checked){
        return item.width > item.height ? "landscape" : "portrait";
    }
    return orientation;
}

function getPreviewMargin(mm){
    const margins = {0:0,5:2.4,10:4.8,15:7.1,20:9.4};
    return margins[mm] ?? 4.8;
}

function removeImage(index){
    URL.revokeObjectURL(files[index].url);
    files.splice(index,1);
    renderInterface();
}

function moveImage(index,direction){
    const targetIndex = index + direction;
    if(targetIndex < 0 || targetIndex >= files.length) return;
    const temp = files[index];
    files[index] = files[targetIndex];
    files[targetIndex] = temp;
    renderInterface();
}

clearImages.addEventListener("click", () => {
    files.forEach(item => URL.revokeObjectURL(item.url));
    files = [];
    renderInterface();
});

portraitOption.addEventListener("click", () => {
    orientation = "portrait";
    portraitOption.classList.add("active");
    landscapeOption.classList.remove("active");
    renderInterface();
});

landscapeOption.addEventListener("click", () => {
    orientation = "landscape";
    landscapeOption.classList.add("active");
    portraitOption.classList.remove("active");
    renderInterface();
});

[pageSize,imageFit,marginInput,autoOrientation].forEach(el =>
    el.addEventListener("change",renderInterface)
);
qualityInput.addEventListener("change",updateSummary);

function updateSummary(){
    const count = files.length;
    summaryImages.textContent = count;
    summaryPages.textContent = count;
    summaryFormat.textContent = pageSize.value.toUpperCase();
    summaryOrientation.textContent = autoOrientation.checked ? "Automatic" : capitalize(orientation);
    topStat.textContent = count === 1 ? "1 image" : count+" images";
    downloadBtn.disabled = count === 0;
    mobileDownloadBtn.disabled = count === 0;
}

function loadImage(url){
    return new Promise((resolve,reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = url;
    });
}

function imageToDataURL(image,quality){
    const canvas = document.createElement("canvas");
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;
    const context = canvas.getContext("2d");
    context.fillStyle = "#ffffff";
    context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(image,0,0);
    return canvas.toDataURL("image/jpeg",quality);
}

async function createPDF(){
    if(files.length === 0) return;

    downloadBtn.disabled = true;
    mobileDownloadBtn.disabled = true;
    processing.style.display = "block";
    mobileDownloadBtn.textContent = "Creating PDF...";

    try{
        let pdf = null;

        for(let i=0;i<files.length;i++){
            const item = files[i];
            const image = await loadImage(item.url);

            let currentOrientation = orientation;
            if(autoOrientation.checked){
                currentOrientation = image.naturalWidth > image.naturalHeight ? "landscape" : "portrait";
            }

            if(pdf === null){
                pdf = new jsPDF({orientation:currentOrientation,unit:"mm",format:pageSize.value});
            }else{
                pdf.addPage(pageSize.value,currentOrientation);
            }

            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            const margin = Number(marginInput.value);
            const usableWidth = pdfWidth - margin*2;
            const usableHeight = pdfHeight - margin*2;
            const imageRatio = image.naturalWidth / image.naturalHeight;
            const targetRatio = usableWidth / usableHeight;

            let drawWidth,drawHeight,x,y;

            if(imageFit.value === "contain"){
                if(imageRatio > targetRatio){
                    drawWidth = usableWidth;
                    drawHeight = drawWidth/imageRatio;
                }else{
                    drawHeight = usableHeight;
                    drawWidth = drawHeight*imageRatio;
                }
                x = margin + (usableWidth-drawWidth)/2;
                y = margin + (usableHeight-drawHeight)/2;
            }else if(imageFit.value === "cover"){
                if(imageRatio > targetRatio){
                    drawHeight = usableHeight;
                    drawWidth = drawHeight*imageRatio;
                }else{
                    drawWidth = usableWidth;
                    drawHeight = drawWidth/imageRatio;
                }
                x = margin + (usableWidth-drawWidth)/2;
                y = margin + (usableHeight-drawHeight)/2;
            }else{
                drawWidth = image.naturalWidth*25.4/96;
                drawHeight = image.naturalHeight*25.4/96;

                if(drawWidth > usableWidth || drawHeight > usableHeight){
                    const scale = Math.min(usableWidth/drawWidth,usableHeight/drawHeight);
                    drawWidth *= scale;
                    drawHeight *= scale;
                }
                x = (pdfWidth-drawWidth)/2;
                y = (pdfHeight-drawHeight)/2;
            }

            const jpegData = imageToDataURL(image,Number(qualityInput.value));

            if(imageFit.value === "cover"){
                pdf.saveGraphicsState();
                pdf.rect(margin,margin,usableWidth,usableHeight);
                pdf.clip();
                pdf.addImage(jpegData,"JPEG",x,y,drawWidth,drawHeight,undefined,"FAST");
                pdf.restoreGraphicsState();
            }else{
                pdf.addImage(jpegData,"JPEG",x,y,drawWidth,drawHeight,undefined,"FAST");
            }
        }

        const date = new Date().toISOString().slice(0,10);
        pdf.save("PDF-Wiz-"+date+".pdf");
    }catch(error){
        console.error(error);
        alert("PDF Wiz could not create the PDF. Please try again.");
    }finally{
        processing.style.display = "none";
        mobileDownloadBtn.textContent = "Download PDF";
        const disabled = files.length === 0;
        downloadBtn.disabled = disabled;
        mobileDownloadBtn.disabled = disabled;
    }
}

downloadBtn.addEventListener("click",createPDF);
mobileDownloadBtn.addEventListener("click",createPDF);

function formatFileSize(bytes){
    if(bytes < 1024) return bytes+" B";
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1)+" KB";
    return (bytes/1024/1024).toFixed(2)+" MB";
}
function escapeHTML(text){
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}
function capitalize(text){
    return text.charAt(0).toUpperCase()+text.slice(1);
}

renderInterface();
</script>
